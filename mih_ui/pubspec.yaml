  intl: ^0.20.2
  flutter_native_splash: ^2.4.6
  printing: ^5.14.2
  geolocator: ^14.0.1
  geolocator_linux: ^0.2.4
  table_calendar: ^3.1.2
  mobile_scanner: ^7.0.1
  flutter_launcher_icons: ^0.14.4
  barcode_widget: ^2.0.4 #Generate Barcodes
  url_launcher: ^6.3.1
  fl_downloader: ^2.0.2
  local_auth: ^2.3.0
  math_expressions: ^3.1.0
  ollama_dart: ^2.3.0
  flutter_chat_ui: ^2.11.1
  flutter_chat_types: ^3.6.2
  uuid: ^4.5.1
  flutter_tts: ^4.2.3
  flutter_speed_dial: ^7.0.0
  share_plus: ^13.2.0
  #app_settings: ^6.1.1
  pwa_install: ^0.0.6
  google_mobile_ads: ^8.0.0
  gma_mediation_meta: ^1.4.1
  redacted: ^1.0.13
  custom_rating_bar: ^3.0.0
  country_code_picker: ^3.3.0
  ken_logger: ^0.0.3
  go_router: ^17.3.0
  screen_brightness: ^2.1.6
  cached_network_image: ^3.4.1
  upgrader: ^13.5.0
  screenshot: ^3.0.0
  file_saver: ^0.4.0
  provider: ^6.1.5+1
  flutter_ai_toolkit: ^1.0.0
  flutter_markdown_plus: ^1.0.5
  cross_file: ^0.3.5+1
  quick_actions: ^1.1.0
  hive_ce:
  hive_ce_flutter:

dependency_overrides:
  supertokens_flutter: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_web_compilers: ^4.1.5
  flutter_lints: ^6.0.0

  hive_ce_generator:
  build_runner:

flutter:
  uses-material-design: true
  assets:
    - lib/mih_package_components/assets/images/
    - lib/mih_package_components/assets/fonts/
    - lib/mih_package_components/assets/images/loyalty_cards/
    - lib/mih_package_components/assets/images/loyalty_cards/mini/
    - lib/mih_package_components/assets/images/app_icon/
    - lib/mih_package_components/assets/images/splash_screen/

  fonts:
    - family: MihIcons
      fonts:
        - asset: lib/mih_package_components/assets/fonts/Mih_Icons.ttf

flutter_native_splash:
  color: "#3A4454"
  image: lib/mih_package_components/assets/images/splash_screen/mih_image_splash.png
  branding: lib/mih_package_components/assets/images/splash_screen/mih_branding_splash.png
  image_web: lib/mih_package_components/assets/images/splash_screen/mih_image_splash_temp.gif
  branding_web: lib/mih_package_components/assets/images/splash_screen/mih_branding_splash_temp.gif
  branding_mode: bottom
  branding_bottom_padding: 24
  android_12:
    color: "#3A4454"
    image: lib/mih_package_components/assets/images/splash_screen/mih_image_splash_android.png
    branding: lib/mih_package_components/assets/images/splash_screen/mih_branding_splash.png
