environment:
  sdk: ">=3.5.3 <4.0.0"
  # flutter: ">=1.17.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  mih_package_toolkit: ^0.0.6
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  # firebase_core: ^4.4.0
  # firebase_core_desktop: ^1.0.2
  syncfusion_flutter_core: ^33.2.15
